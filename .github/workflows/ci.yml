name: ci

# Runs on every push and every PR. The ruleset `main: require CI` (id 24900279) requires
# this job's `check (3.11)`, `check (3.12)` and `check (3.13)` on main, so a red or pending
# build blocks a merge rather than advising against one. #60 -- the issue that asked for
# branch protection -- is closed: the repository is public MIT, so the ruleset is enforceable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs, but only a commit's own run may: attempt 1 still kills older runs
# on its ref (a superseded red is not evidence of anything), while a re-run -- attempt 2+ --
# must not cancel a newer commit's run, whose CI is the tip's; it waits in the group (#224).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.11", so 3.11 is the floor that must keep working
        # and 3.13 is the newest the project has to survive. fail-fast is off so one
        # version breaking does not hide a second one breaking.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `pip install -e .` resolves from pyproject, which is also what proves the
      # editable install actually works. The pipx incident -- numpy added after the
      # install and never reaching the venv -- was invisible until a command was run
      # from the installed copy, so CI runs the installed package where it can.
      # ffmpeg/ffprobe are genuinely required, by one narrow route: the suite
      # synthesises real video frames as fixture input with `ffmpeg -frames:v 1`.
      # Everything else is stubbed. The first CI run proved the distinction --
      # `deps.check_executable` probes the real PATH, so a test asserting "a dead
      # gateway costs the vision stages, not the run" was being answered by "ffmpeg
      # is missing, exit 2". That assertion is now stubbed against a controlled PATH
      # (see tests/test_stages.py), and ffmpeg is installed here for the fixtures.
      - name: Install ffmpeg (fixture synthesis only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # `.[dev]` is also the install `tools/check.sh` runs locally, and it carries the
      # ruff pin from `pyproject.toml` -- the single place the version is written down
      # (#166). It used to be repeated here, and a second copy is how this job and a
      # contributor's shell drift onto builds that disagree: the host's 0.16.10 produced
      # identical output on two trees this pin tells apart -- one it passes, one it flags
      # with an E402 -- so it could not see the difference between the state that passed
      # and the state that failed.
      - name: Install the package under test, with the pinned dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dependency truth (ADR-0002 D2)
        run: python tests/test_deps.py

      - name: Claim drift (#48 checks 2-5)
        run: python tests/test_claims.py

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      # The suite is script-based, not pytest: `check(name, cond, detail)` and a
      # non-zero exit. It is invoked directly, and deliberately runs with no
      # DYAK_* in the environment -- PATH and HTTP are stubbed, so the suite must
      # pass on a runner with no ffmpeg, no whisper.cpp and no gateway. A test that
      # silently starts depending on this host stops proving anything.
      - name: Stage suite
        run: python tests/test_stages.py

      - name: Doctor suite
        run: python tests/test_doctor.py

      # The precedence resolver (#52): flag > environment > settings file > default, the flat
      # key naming rule, the derived honoured-key set, and typo rejection. It drives the real
      # call sites (vault, terms dir, output dir, work dir, both model roles, STT), so a
      # resolver that works but is not consulted fails here.
      - name: Settings resolver suite (#52)
        run: python tests/test_settings.py

      # The model-id invariant (#61): the id that was *requested* stays canonical in
      # `synth.json`, while the id the endpoint *reported* is recorded beside it and never
      # overwrites it. This suite passed for months while no workflow ran it (#173) -- a
      # suite nothing invokes cannot fail, so the invariant was free to drift with `llm.py`.
      # It stubs `urlopen` and `llm.chat`, so it needs no gateway, no key and no host state.
      - name: Model-id provenance suite (#61)
        run: python tests/test_llm.py

      # The local web view (#242 M1): the subcommand is registered, its five endpoints answer,
      # the run's lines reach the SSE stream exactly as `pipeline.run` wrote them, and the token,
      # Host, Origin and `--root` checks hold. It binds a real server on loopback port 0 with a
      # stubbed pipeline, so it needs no ffmpeg and no gateway and gives the same answer on this
      # runner as on a host with a live transcriber -- the failure mode of #175 and #184.
      - name: Local web view suite (#242 M1)
        run: python tests/test_serve.py

      # The only step that leaves this process. Every other suite replaces functions in
      # place -- `runner.run`, `urlopen`, `llm.chat` -- which is exactly why the bugs
      # this one exists for were found by a human doing a real run and by nothing here:
      # a stage that reads a work-dir path it already published (#89), a frame directory
      # cleared after the stage that reads it, a caption cache wired to the scratch dir
      # instead of the bundle (#121). This runs `dyak process` as a subprocess with
      # `DYAK_*` scrubbed, against three loopback `http.server` fakes (whisper.cpp, the
      # vision model, the text model, each on its own port so a request reaching the
      # wrong endpoint fails a check) and an 8-second fixture generated with ffmpeg, then
      # asserts the exit code and the bundle on disk. No network, no key, no host state.
      # It skips cleanly when ffmpeg is absent, so the no-ffmpeg guarantee above holds.
      - name: End-to-end run (#122)
        run: python tests/test_e2e.py

# Gating is a repository setting and cannot be set from a workflow file. The ruleset
# `main: require CI` names all three `check` jobs on main, so this workflow does gate:
# a failing or pending run rejects the merge, and a red build on a PR is blocking.