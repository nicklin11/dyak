[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyak"
version = "0.1.0"
description = "One-command lecture pipeline: video/audio -> audited Markdown note"
readme = "README.md"
requires-python = ">=3.11"
# numpy: stage 5 measures MEGE at the frame's native resolution. In pure Python that is a
# ~20 s per-frame pass over 1.4 M pixels, which would make the quality gate slower than
# speech recognition. Measured alternative: downscaling first is what made crops
# incomparable, so the dependency buys the fix.
dependencies = ["numpy>=1.26"]

# The lint pin, written down here and nowhere else -- CI installs this extra
# (`pip install -e ".[dev]"`) instead of repeating the version, so a local run and CI
# cannot end up on different ruff builds (#166). They did: the host had 0.16.10, whose
# output was identical on two trees the pin tells apart -- 123 findings and zero E402 on
# both, where the pin passes one and flags a single E402 on the other. A local "ruff is
# clean" was therefore not evidence about CI, and PR #158 merged a red Lint step on it.
#
# `ruff format` changes its output between releases, so an unpinned ruff also makes
# `format --check` fail on files nobody touched -- a check that cries wolf gets
# disabled. Bumping the pin is a deliberate act: bump it, then reformat the whole tree
# in the same commit, so the diff is a reformat and not a surprise.
[project.optional-dependencies]
dev = ["ruff==0.15.20"]

[project.scripts]
dyak = "dyak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100